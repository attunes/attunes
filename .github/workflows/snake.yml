name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: attunes
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#6F8174&color_dots=#F4F8E8,#C9D8CD,#9DB4A6,#6F8174,#365E55
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#F4F8E8&color_dots=#061011,#182522,#243B34,#365E55,#9DB4A6

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
