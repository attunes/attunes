name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: attunes
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#7BB89D&color_dots=#F4FAF0,#DCEADD,#CFE6C9,#8DBF8A,#4F8F86
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#E4C77A&color_dots=#061011,#284743,#4F8F86,#7BB89D,#E4C77A

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
